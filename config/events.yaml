  task.bucket_orphaned: {category: task, display: task bucket orphaned, formatter: task.bucket_orphaned}
  task.completed: {category: task, display: task completed, formatter: task.completed}
  task.created: {category: task, display: task created, formatter: task.created}
  task.edited: {category: task, display: task edited, formatter: task.edited}
  task.migrated: {category: task, display: task migrated, formatter: task.migrated}
  task.moved: {category: task, display: task moved, formatter: task.moved}
  task.removed: {category: task, display: task removed, formatter: task.removed}
  task.unarchived: {category: task, display: task unarchived, formatter: task.unarchived}
